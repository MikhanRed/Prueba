<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Creá tu cuenta en Mikhan y empezá a descubrir, y crear mundos.">
    <meta name="author" content="Mikhan">
    <title>Registrarse — Mikhan</title>
    <link rel="stylesheet" href="../../css/style.css">

    <style>
        .registro {
            min-height: calc(100vh - 120px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
        }

        .registro-card {
            width: 100%;
            max-width: 520px;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-soft);
            padding: 40px;
            box-sizing: border-box;
        }

        .registro-card h1 {
            margin-top: 0;
            text-align: center;
            color: var(--color-heading);
        }

        .registro-intro {
            text-align: center;
            margin-bottom: 30px;
        }

        .registro-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .campo label {
            color: var(--color-text);
            font-family: var(--font-ui);
            font-weight: bold;
        }

        .campo input {
            width: 100%;
            padding: 12px 14px;
            box-sizing: border-box;
            border: 1px solid var(--color-border-dark);
            border-radius: var(--radius);
            background: var(--color-background);
            color: var(--color-text);
            font-family: var(--font-ui);
            font-size: 1rem;
        }

        .campo input:focus {
            outline: 2px solid var(--color-focus);
            border-color: var(--color-focus);
        }

        .registro-terminos {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            color: var(--color-muted);
            font-family: var(--font-ui);
            font-size: .9rem;
            line-height: 1.4;
        }

        .registro-terminos input {
            margin-top: 3px;
            accent-color: var(--color-primary);
        }

        .registro-terminos a,
        .registro-extra a {
            color: var(--color-secondary);
        }

        .registro-boton {
            width: 100%;
            padding: 13px 20px;
            border: 0;
            border-radius: var(--radius);
            background: var(--color-primary);
            color: var(--color-soft-orange);
            font-family: var(--font-ui);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .registro-boton:hover {
            background: var(--color-secondary);
            color: var(--color-text);
        }

        .registro-extra {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--color-border);
            text-align: center;
            font-family: var(--font-ui);
        }

        @media (max-width: 600px) {
            .registro-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

<nav>
    <ul>
        <img src="../../img/mikhan logo.png" alt="Logo Mikhan">
        <li><a href="../../index/index.html">Entrada</a></li>
        <li><a href="../../bibliotecas/biblioteca.html">Bibliotecas</a></li>
        <li><a href="../../tablon/tablon.html">Mi tablón</a></li>
        <li><a href="../../taberna/taberna_index.html">Taberna</a></li>
        <li><a href="../../talleres/talleres.html">Talleres</a></li>
        <li><a href="ingresar.html">Ingresar</a></li>
    </ul>
</nav>

<main class="registro">

    <section class="registro-card">
        <h1>Crear una cuenta</h1>

        <p class="registro-intro">
            Entrá a Mikhan y empezá a descubrir, compartir y crear nuevos mundos.
        </p>

        <form class="registro-form" action="#" method="post">

            <div class="campo">
                <label for="nombre">Nombre de usuario</label>
                <input type="text" id="nombre" name="nombre"
                       placeholder="Elegí tu nombre de usuario"
                       autocomplete="username" required>
            </div>

            <div class="campo">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email"
                       placeholder="tu@email.com"
                       autocomplete="email" required>
            </div>

            <div class="campo">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena"
                       placeholder="Creá una contraseña"
                       autocomplete="new-password" required>
            </div>

            <div class="campo">
                <label for="confirmar-contrasena">Confirmar contraseña</label>
                <input type="password" id="confirmar-contrasena"
                       name="confirmar-contrasena"
                       placeholder="Repetí tu contraseña"
                       autocomplete="new-password" required>
            </div>

            <label class="registro-terminos">
                <input type="checkbox" name="terminos" required>
                <span>
                    Acepto los
                    <a href="../../terminos.html">Términos y condiciones</a>
                    y la
                    <a href="../../privacidad.html">Política de privacidad</a>.
                </span>
            </label>

            <button class="registro-boton" type="submit">
                Crear mi cuenta
            </button>

        </form>

        <p class="registro-extra">
            ¿Ya tenés una cuenta?
            <a href="ingresar.html">Iniciá sesión</a>
        </p>
    </section>

</main>

</body>
</html>
