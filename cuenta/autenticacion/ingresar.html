<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Iniciá sesión en Mikhan y continuá descubriendo nuevos mundos.">
    <meta name="author" content="Mikhan">
    <title>Iniciar sesión — Mikhan</title>

    <link rel="stylesheet" href="../../css/style.css">

    <style>
        .login {
            min-height: calc(100vh - 120px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 480px;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-soft);
            padding: 40px;
            box-sizing: border-box;
        }

        .login-card h1 {
            margin-top: 0;
            margin-bottom: 10px;
            color: var(--color-heading);
            text-align: center;
        }

        .login-intro {
            margin-bottom: 30px;
            text-align: center;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .campo label {
            color: var(--color-text);
            font-family: var(--font-ui);
            font-weight: bold;
        }

        .campo input {
            width: 100%;
            padding: 12px 14px;
            box-sizing: border-box;
            border: 1px solid var(--color-border-dark);
            border-radius: var(--radius);
            background: var(--color-background);
            color: var(--color-text);
            font-family: var(--font-ui);
            font-size: 1rem;
        }

        .campo input:focus {
            outline: 2px solid var(--color-focus);
            border-color: var(--color-focus);
        }

        .login-ayuda {
            display: flex;
            justify-content: flex-end;
            margin-top: -8px;
            font-family: var(--font-ui);
            font-size: .9rem;
        }

        .login-ayuda a,
        .login-registro a {
            color: var(--color-secondary);
        }

        .login-boton {
            width: 100%;
            padding: 13px 20px;
            border: 0;
            border-radius: var(--radius);
            background: var(--color-primary);
            color: var(--color-soft-orange);
            font-family: var(--font-ui);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .login-boton:hover {
            background: var(--color-secondary);
            color: var(--color-text);
        }

        .login-registro {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--color-border);
            text-align: center;
            font-family: var(--font-ui);
        }

        @media (max-width: 600px) {
            .login-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

<body>

    <!-- NAVBAR -->
    <nav>
        <ul>
            <img src="../../img/mikhan logo.png" alt="Logo Mikhan">

            <li><a href="../../index/index.html">Entrada</a></li>
            <li><a href="../../bibliotecas/biblioteca.html">Bibliotecas</a></li>
            <li><a href="../../tablon/tablon.html">Mi tablón</a></li>
            <li><a href="../../taberna/taberna_index.html">Taberna</a></li>
            <li><a href="../../talleres/talleres.html">Talleres</a></li>
            <li><a href="ingresar.html">Ingresar</a></li>
        </ul>
    </nav>
<main class="login">

    <section class="login-card">

        <h1>Bienvenido a Mikhan</h1>

        <p class="login-intro">
            Iniciá sesión para continuar explorando tus mundos.
        </p>

        <form class="login-form" action="#" method="post">

            <div class="campo">
                <label for="usuario">Nombre de usuario o correo</label>
                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Tu usuario o correo"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="campo">
                <label for="contrasena">Contraseña</label>
                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    placeholder="Tu contraseña"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="login-ayuda">
                <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
            </div>

            <button class="login-boton" type="submit">
                Iniciar sesión
            </button>

        </form>

        <p class="login-registro">
            ¿Todavía no tenés una cuenta?
            <a href="registro.html">Registrate en Mikhan</a>
        </p>

    </section>

</main>

</body>
</html>
